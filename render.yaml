services:
  # Backend API Server on Render
  - type: web
    name: aarohan-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

