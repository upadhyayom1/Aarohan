name: Aarohan CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Test and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1. Client Lint and Build
      # -------------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install and test Client
        working-directory: ./client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # -------------------------------------------------------------
      # 2. Server Verification
      # -------------------------------------------------------------
      - name: Install and test Server
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/test?sslmode=disable' }}
          JWT_SECRET: "test_super_secret_jwt_key_at_least_32_characters"
        run: |
          npm ci
          npx prisma generate

      # -------------------------------------------------------------
      # 3. AI / Python Pytest Suite
      # -------------------------------------------------------------
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test AI Service
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pytest tests/

      # -------------------------------------------------------------
      # 4. Docker Compose Config Validation
      # -------------------------------------------------------------
      - name: Validate Docker Compose Configuration
        run: docker compose config

  deploy:
    name: Automated Deployment to Production VPS
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deploy
        if: "${{ env.SSH_HOST != '' }}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "SSH_HOST secret not configured. Skipping remote VPS SSH deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh $SSH_USER@$SSH_HOST "cd /opt/aarohan && git pull origin main && docker compose up --build -d"

